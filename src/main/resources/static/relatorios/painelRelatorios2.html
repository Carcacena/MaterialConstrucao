<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title>Painel de Relatórios - Material de Construção</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #2c3e50, #4caf50);
			color: white;
			text-align: center;
			padding: 40px;
			margin: 0;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			box-sizing: border-box;
		}

		.box {
			background: rgba(0, 0, 0, 0.55);
			padding: 35px;
			border-radius: 12px;
			min-width: 480px;
			box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
			box-sizing: border-box;
		}

		h2 {
			margin-top: 0;
			margin-bottom: 25px;
			color: #ff9800;
		}

		h4 {
			margin-top: 20px;
			margin-bottom: 5px;
			text-align: left;
			color: #5eff5e;
			border-bottom: 1px solid rgba(255, 255, 255, 0.2);
			padding-bottom: 5px;
		}

		button {
			display: block;
			width: 100%;
			margin: 12px 0;
			padding: 12px;
			border: none;
			background: #2e7d32;
			color: white;
			cursor: pointer;
			border-radius: 6px;
			font-size: 14px;
			font-weight: bold;
			transition: 0.3s;
			text-align: left;
			box-sizing: border-box;
		}

		button:hover {
			background: #4CAF50;
			transform: scale(1.02);
		}

		/* ⚡ Botão Voltar destacado em laranja */
		button.btn-voltar {
			background: #ff9800;
			text-align: center;
			margin-top: 25px;
		}

		button.btn-voltar:hover {
			background: #e68a00;
		}
	</style>
</head>

<body>
	<div class="box">
		<h2>📊 Relatórios Gerenciais (PDF)</h2>

		<h4>🧾 Módulos Fiscais, Compras & Vendas</h4>

		<!-- ========================================================== -->
		<!-- 📥 PAINEL 1: FISCAL & COMPRAS (ENTRADAS - VERDE)          -->
		<!-- ========================================================== -->
		<div style="
		    background: rgba(255, 255, 255, 0.95);
		    color: #2c3e50;
		    padding: 18px;
		    border-radius: 8px;
		    margin: 15px 0;
		    text-align: left;
		    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
		    border-left: 5px solid #2e7d32;
		">
			<h3
				style="margin-top: 0; color: #2e7d32; border-bottom: 2px solid #2e7d32; padding-bottom: 5px; font-size: 14px;">
				📥 Painel Gerencial de Entradas (Notas Fiscais de Compra)
			</h3>

			<!-- DATAS + FILTRO ENTRADA -->
			<div style="display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-end;">
				<div style="flex: 1;">
					<label style="font-size: 11px; font-weight: bold; color: #555;">Data Início:</label>
					<input type="date" id="entradaDataInicio"
						style="width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; box-sizing: border-box;">
				</div>
				<div style="flex: 1;">
					<label style="font-size: 11px; font-weight: bold; color: #555;">Data Fim:</label>
					<input type="date" id="entradaDataFim"
						style="width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; box-sizing: border-box;">
				</div>
				<button type="button" onclick="filtrarEntradasPorPeriodo()"
					style="background: #2e7d32; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 0; width: auto; font-size: 12px;">
					🔍 Filtrar
				</button>
			</div>

			<!-- DROPDOWN DE ENTRADAS -->
			<div style="margin-bottom: 12px;">
				<label style="font-size: 11px; font-weight: bold; color: #555;">Selecione a Nota Fiscal no
					Período:</label>
				<select id="selectEntradaDinamica"
					style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; color: #2c3e50; margin-top: 3px; font-size: 12px; background-color: #fff; box-sizing: border-box;">
					<option value="">-- SELECIONE UMA NOTA FISCAL --</option>
				</select>
			</div>

			<!-- IMPRIMIR DANFE ENTRADA -->
			<button type="button" onclick="imprimirDanfePeloPainel()"
				style="background: #2e7d32; color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; font-size: 13px; margin: 0;">
				🖨️ DANFE Consolidada - Entrada de Produtos (PDF)
			</button>
		</div>

		<!-- ========================================================== -->
		<!-- 🛒 PAINEL 2: VENDAS & SAÍDAS (CUPONS - AZUL)              -->
		<!-- ========================================================== -->
		<div style="
		    background: rgba(255, 255, 255, 0.95);
		    color: #2c3e50;
		    padding: 18px;
		    border-radius: 8px;
		    margin: 15px 0;
		    text-align: left;
		    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
		    border-left: 5px solid #0288d1;
		">
			<h3
				style="margin-top: 0; color: #0288d1; border-bottom: 2px solid #0288d1; padding-bottom: 5px; font-size: 14px;">
				🛒 Painel Gerencial de Saídas (Pedidos de Venda do Caixa)
			</h3>

			<!-- DATAS + FILTRO SAÍDA -->
			<div style="display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-end;">
				<div style="flex: 1;">
					<label style="font-size: 11px; font-weight: bold; color: #555;">Data Início:</label>
					<input type="date" id="vendaDataInicio"
						style="width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; box-sizing: border-box;">
				</div>
				<div style="flex: 1;">
					<label style="font-size: 11px; font-weight: bold; color: #555;">Data Fim:</label>
					<input type="date" id="vendaDataFim"
						style="width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; box-sizing: border-box;">
				</div>
				<button type="button" onclick="filtrarVendasPorPeriodo()"
					style="background: #0288d1; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 0; width: auto; font-size: 12px;">
					🔍 Filtrar
				</button>
			</div>

			<!-- DROPDOWN DE SAÍDAS DE VENDA -->
			<div style="margin-bottom: 12px;">
				<label style="font-size: 11px; font-weight: bold; color: #555;">Selecione o Pedido Efetuado no
					Caixa:</label>
				<select id="selectVendaDinamica"
					style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; color: #2c3e50; margin-top: 3px; font-size: 12px; background-color: #fff; box-sizing: border-box;">
					<option value="">-- SELECIONE UM PEDIDO DE VENDA --</option>
				</select>
			</div>

			<!-- IMPRIMIR DANFE SAÍDA -->
			<button type="button" onclick="imprimirDanfeSaida()"
				style="background: #0288d1; color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; font-size: 13px; margin: 0;">
				🖨️ DANFE Consolidada - Saída de Produtos (PDF)
			</button>
		</div>

		<!-- ========================================================== -->
		<!-- 📋 BLOCO 3: RELATÓRIOS GERENCIAIS INDEPENDENTES            -->
		<!-- ========================================================== -->
		<div
			style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; margin-top: 20px;">
			<button type="button" onclick="window.baixarPdf('/api/relatorios/mim', 'Mapa_Inventario_Mercadorias')"
				style="width: 100%; margin: 0;">
				📋 MIM - Mapa de Inventário de Mercadorias
			</button>

			<button type="button" onclick="window.baixarPdf('/api/relatorios/mgc', 'Mapa_Gerencial_Compras')"
				style="width: 100%; margin: 5px 0 0 0;">
				📈 MGC - Mapa Gerencial de Compras
			</button>
		</div>

		<!-- ⚡ Botão Voltar unificado destacado em laranja -->
		<button type="button" class="btn-voltar" onclick="window.location.href='/menu/menu.html'">
			⬅️ Voltar ao Menu Principal
		</button>

	</div> <!-- 📦 Fecha a div class="box" principal de 480px -->


	<!-- 🌐 Conexão dos módulos externos JS -->
	<script src="/componentes-js/utils.js"></script>
	<script src="/relatorios/modulo-Relatorios.js"></script>

	<script>
		// ⏳ Define as datas de hoje nos campos automaticamente ao carregar a página
		document.addEventListener("DOMContentLoaded", () => {
			const hoje = new Date().toISOString().split('T')[0];

			if (document.getElementById('entradaDataInicio')) document.getElementById('entradaDataInicio').value = hoje;
			if (document.getElementById('entradaDataFim')) document.getElementById('entradaDataFim').value = hoje;
			if (document.getElementById('vendaDataInicio')) document.getElementById('vendaDataInicio').value = hoje;
			if (document.getElementById('vendaDataFim')) document.getElementById('vendaDataFim').value = hoje;
		});

		// ==========================================================
		// 📥 FUNÇÕES DO PAINEL VERDE (ENTRADAS / COMPRAS)
		// ==========================================================
		async function filtrarEntradasPorPeriodo() {
			const dataInicio = document.getElementById('entradaDataInicio').value;
			const dataFim = document.getElementById('entradaDataFim').value;
			const select = document.getElementById('selectEntradaDinamica');

			if (!dataInicio || !dataFim) {
				alert("⚠️ Por favor, informe o período de datas completo!");
				return;
			}

			select.innerHTML = '<option value="">Buscando notas no MySQL...</option>';

			try {
				const token = window.obterTokenSeguro();
				const response = await fetch(`/api/relatorios/entradas/periodo?inicio=${dataInicio}&fim=${dataFim}`, {
					method: "GET",
					headers: {"Authorization": `Bearer ${token}`}
				});

				if (!response.ok) throw new Error("Erro na comunicação com o servidor.");
				const entradas = await response.json();

				if (entradas.length === 0) {
					select.innerHTML = '<option value="">-- NENHUMA NOTA ENCONTRADA NO PERÍODO --</option>';
					return;
				}

				select.innerHTML = '<option value="">-- SELECIONE UMA NOTA FISCAL --</option>';
				entradas.forEach(e => {
					const opt = document.createElement('option');
					opt.value = e.id;
					const numNota = e.numeroNota || 'S/N';
					const fornecedor = e.fornecedorNome || 'Não Informado';
					const valorTotal = e.valorTotalNota ? parseFloat(e.valorTotalNota).toFixed(2) : '0.00';

					opt.textContent = `🏭 Forn: ${fornecedor} | NF: ${numNota} | Total: R$ ${valorTotal}`;
					select.appendChild(opt);
				});
			} catch (erro) {
				console.error("Erro ao carregar notas:", erro);
				select.innerHTML = '<option value="">Erro ao carregar notas do banco</option>';
			}
		}

		function imprimirDanfePeloPainel() {
			const idNota = document.getElementById('selectEntradaDinamica').value;
			if (!idNota) {
				alert("⚠️ Por favor, selecione uma Nota Fiscal na lista antes de imprimir!");
				return;
			}
			window.baixarPdf(`/api/relatorios/danfe/${idNota}`, `DANFE_Consolidada_Nota_${idNota}`);
		}

		// ==========================================================
		// 🛒 FUNÇÕES DO PAINEL AZUL (VENDAS / SAÍDAS)
		// ==========================================================
		async function filtrarVendasPorPeriodo() {
			const dataInicio = document.getElementById('vendaDataInicio').value;
			const dataFim = document.getElementById('vendaDataFim').value;
			const select = document.getElementById('selectVendaDinamica');

			if (!dataInicio || !dataFim) {
				alert("⚠️ Por favor, informe o período de datas completo!");
				return;
			}

			select.innerHTML = '<option value="">Buscando pedidos de venda no MySQL...</option>';

			try {
				const token = window.obterTokenSeguro();
				const response = await fetch(`/api/relatorios/vendas/periodo?inicio=${dataInicio}&fim=${dataFim}`, {
					method: "GET",
					headers: {"Authorization": `Bearer ${token}`}
				});

				if (!response.ok) throw new Error("Erro na comunicação com o servidor.");
				const vendas = await response.json();

				if (vendas.length === 0) {
					select.innerHTML = '<option value="">-- NENHUM PEDIDO DE VENDA ENCONTRADO NO PERÍODO --</option>';
					return;
				}

				select.innerHTML = '<option value="">-- SELECIONE UM PEDIDO DE VENDA --</option>';
				vendas.forEach(v => {
					const opt = document.createElement('option');

					// 🎯 MODIFICADO: Guarda o número real do pedido (ex: PED-17889...) para o Java conseguir buscar
					const numPedido = v.numeroNota || 'S/P';
					opt.value = numPedido;

					const cliente = v.fornecedorNome || 'Consumidor Final';
					const total = v.valorTotalNota ? parseFloat(v.valorTotalNota).toFixed(2) : '0.00';

					// 🎯 MODIFICADO: Exibe o número real do pedido no texto para o usuário
					opt.textContent = `🛒 Pedido Nº: ${numPedido} | Cliente: ${cliente} | Total: R$ ${total}`;
					select.appendChild(opt);
				});
			} catch (erro) {
				console.error("Erro ao filtrar vendas:", erro);
				select.innerHTML = '<option value="">Erro ao carregar pedidos do banco</option>';
			}
		}

		function imprimirDanfeSaida() {
			const idVenda = document.getElementById('selectVendaDinamica').value;
			if (!idVenda) {
				alert("⚠️ Por favor, selecione um Pedido de Venda na lista antes de imprimir!");
				return;
			}
			window.baixarPdf(`/api/relatorios/danfe-saida/${idVenda}`, `DANFE_Saida_Pedido_${idVenda}`);
		}
	</script>


</body>

</html>
