<div class="modal fade" id="modalFecharPedido" tabindex="-1" aria-hidden="true"
	style="display: none; position: fixed; top: 15%; left: 35%; width: 420px; z-index: 9999;">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content"
			style="background-color: #2c3e50; border: 2px solid #ff9800; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
			<div class="modal-header text-white" style="border-bottom: 1px dashed rgba(255, 152, 0, 0.4);">
				<h5 class="modal-title font-monospace" style="color: #ff9800;">💰 FECHAMENTO DO PEDIDO</h5>
				<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body p-4 text-white">

				<div class="mb-4">
					<label class="form-label">Forma de Pagamento</label>
					<select id="selectPagamentoModal" class="form-select">
						<option value="DINHEIRO">💸 Dinheiro à Vista</option>
						<option value="PIX">⚡ Transferência PIX</option>
						<option value="DEBITO">💳 Cartão de Débito</option>
						<option value="CREDITO">💳 Cartão de Crédito</option>
						<option value="CREDIARIO">📓 No Caderno (Conta Corrente)</option>
					</select>
				</div>
				<div class="mt-3 text-center">
					<h4 style="color: #bdc3c7;">Valor Líquido a Pagar:</h4>
					<div id="totalModalDisplay" style="font-size: 36px; font-weight: bold; color: #5eff5e;">R$ 0,00
					</div>
				</div>
			</div>




			<div class="modal-footer"
				style="border-top: 1px dashed rgba(255, 152, 0, 0.4); background: rgba(0,0,0,0.2);">

				<button type="button" class="btn btn-success fw-bold" onclick="confirmarPagamentoFinanceiro()"
					style="padding: 10px 20px;">
					CONFIRMAR
				</button>
			</div>

		</div>
	</div>
</div>
