<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Mesa de Negociação - Sistema Magia</title>

	
	
	
	<style>
		body {
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #2c3e50, #4caf50);
			color: white;
			min-height: 100vh;
			padding: 25px;
			margin: 0;
			user-select: none;
		}

		h2,
		h4 {
			color: white;
			margin-bottom: 12px;
		}

		/* ======================================================
           ESTRUTURA PRINCIPAL
           ====================================================== */

		.grid-caixa {
			display: flex;
			flex-direction: row;
			gap: 20px;
			width: 100%;
			margin-top: 15px;
			align-items: stretch;
		}

		.bloco-arvore {
			flex: 1.4;
			min-width: 450px;
		}

		.bloco-carrinho {
			flex: 1.1;
			min-width: 380px;
		}

		.box-custom {
			background: rgba(0, 0, 0, 0.45);
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
			height: 100%;
		}

		/* ======================================================
           CAMPOS
           ====================================================== */

		.form-control,
		.form-select {
			width: 100% !important;
			padding: 10px !important;
			color: white !important;
			background: rgba(255, 255, 255, 0.1) !important;
			border: 1px solid rgba(255, 255, 255, 0.2) !important;
			border-radius: 6px;
		}

		.form-control:focus,
		.form-select:focus {
			color: white !important;
			background: rgba(255, 255, 255, 0.2) !important;
			border-color: #ff9800 !important;
			outline: none;
			box-shadow: none;
		}

		.form-control::placeholder {
			color: #bdc3c7;
		}

		.form-select option {
			color: white;
			background: #2c3e50;
		}

		.form-label {
			display: block;
			margin-bottom: 6px !important;
			color: #ff9800;
			font-weight: bold;
		}

		/* ======================================================
           STATUS
           ====================================================== */

		.status-badge {
			padding: 5px 10px;
			border-radius: 4px;
			font-size: 13px;
			font-weight: bold;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.status-andamento {
			color: black;
			background: #f39c12;
		}

		/* ======================================================
           CATÁLOGO / ÁRVORE
           ====================================================== */

		.bloco-localizar-produto {
			display: flex;
			flex-direction: column;
			min-height: 560px;
		}

		.cabecalho-arvore {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 15px;
			padding-bottom: 14px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.12);
		}

		.cabecalho-arvore h4 {
			margin: 0 0 4px 0;
		}

		.cabecalho-arvore small {
			color: #bdc3c7;
		}

		.contador-catalogo {
			min-width: 75px;
			padding: 8px 12px;
			text-align: center;
			background: rgba(255, 152, 0, 0.12);
			border: 1px solid rgba(255, 152, 0, 0.35);
			border-radius: 8px;
		}

		.contador-catalogo span {
			display: block;
			color: #ff9800;
			font-size: 22px;
			font-weight: bold;
		}

		.contador-catalogo small {
			color: #bdc3c7;
			font-size: 10px;
			text-transform: uppercase;
		}

		.barra-localizacao {
			display: grid;
			grid-template-columns: minmax(220px, 1fr) 130px;
			gap: 14px;
			margin-top: 16px;
			margin-bottom: 12px;
		}

		.legenda-arvore {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			padding: 8px 10px;
			margin-bottom: 10px;
			color: #bdc3c7;
			background: rgba(0, 0, 0, 0.18);
			border-radius: 6px;
			font-size: 11px;
		}

		.arvore-produtos {
			flex: 1;
			min-height: 290px;
			max-height: 370px;
			overflow-y: auto;
			padding-right: 5px;
			scrollbar-width: thin;
		}

		.mensagem-carregamento,
		.mensagem-vazia {
			padding: 30px 15px;
			color: #bdc3c7;
			text-align: center;
			border: 1px dashed rgba(255, 255, 255, 0.18);
			border-radius: 7px;
		}

		.grupo-produto {
			margin-bottom: 8px;
		}

		.produto-header,
		.fornecedor-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 10px;
			width: 100%;
			padding: 12px 14px;
			margin-top: 6px;
			color: white;
			background: rgba(0, 0, 0, 0.28);
			border: 1px solid rgba(255, 152, 0, 0.28);
			border-radius: 7px;
			cursor: pointer;
			text-align: left;
			font-weight: bold;
			transition: 0.2s ease;
		}

		.produto-header:hover,
		.fornecedor-header:hover {
			background: rgba(255, 152, 0, 0.13);
			border-color: rgba(255, 152, 0, 0.65);
		}

		.produto-header.aberto {
			background: rgba(255, 152, 0, 0.18);
			border-color: #ff9800;
		}

		.produto-header-esquerda {
			display: flex;
			align-items: center;
			gap: 9px;
		}

		.produto-seta {
			display: inline-block;
			width: 14px;
			color: #ff9800;
			transition: transform 0.2s ease;
		}

		.produto-header.aberto .produto-seta {
			transform: rotate(90deg);
		}

		.produto-quantidade-marcas {
			min-width: 30px;
			padding: 3px 8px;
			color: #ff9800;
			background: rgba(255, 152, 0, 0.12);
			border-radius: 12px;
			text-align: center;
			font-size: 11px;
			font-weight: bold;
		}

		.produtos-lista {
			display: none;
			margin: 4px 0 10px 18px;
			padding-left: 12px;
			border-left: 2px solid rgba(255, 152, 0, 0.25);
		}

		.produto-item {
			position: relative;
			display: block;
			margin-top: 6px;
			padding: 11px 12px;
			background: rgba(255, 255, 255, 0.035);
			border: 1px solid transparent;
			border-radius: 6px;
			cursor: pointer;
			transition: 0.18s ease;
		}

		.produto-item:hover {
			transform: translateX(3px);
			background: rgba(255, 255, 255, 0.075);
		}

		.produto-item.selecionado {
			background: rgba(255, 152, 0, 0.22) !important;
			border-color: #ff9800 !important;
			box-shadow: 0 0 10px rgba(255, 152, 0, 0.15);
		}

		.produto-item.validade-proxima {
			background: rgba(192, 57, 43, 0.18);
			border-left: 4px solid #ff5b4d;
		}

		.produto-linha-principal {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 12px;
		}

		.produto-fornecedor {
			color: white;
		}

		.produto-tipo {
			margin-left: 5px;
			color: #ffb74d;
			font-size: 11px;
		}

		.produto-preco {
			white-space: nowrap;
			padding: 4px 9px;
			color: white;
			background: #278c4c;
			border-radius: 12px;
			font-size: 12px;
			font-weight: bold;
		}

		.produto-linha-detalhes {
			margin-top: 5px;
			color: #bdc3c7;
			font-size: 11px;
			line-height: 1.5;
		}

		.produto-margem {
			color: #74e68c;
			font-weight: bold;
		}

		.produto-validade-alerta {
			color: #ff8a80;
			font-weight: bold;
		}

		.painel-produto-selecionado {
			margin-top: 14px;
			padding: 12px 14px;
			background: rgba(0, 0, 0, 0.26);
			border: 1px solid rgba(94, 255, 94, 0.22);
			border-radius: 7px;
		}

		.produto-selecionado-titulo {
			margin-bottom: 4px;
			color: #5eff5e;
			font-weight: bold;
		}

		.produto-selecionado-detalhes {
			color: #bdc3c7;
			font-size: 12px;
		}

		/* ======================================================
           CUPOM
           ====================================================== */

		.table-custom {
			width: 100%;
			margin-top: 5px;
			color: white !important;
		}

		.table-custom th {
			padding: 10px;
			color: #ff9800 !important;
			background: rgba(0, 0, 0, 0.3) !important;
			border-bottom: 2px solid rgba(255, 255, 255, 0.1);
		}

		.item-linha {
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
		}

		.item-linha td {
			padding: 10px 6px;
		}

		.total-caixa {
			margin-top: 10px;
			padding: 12px;
			color: #5eff5e;
			background: rgba(0, 0, 0, 0.3);
			border: 1px solid rgba(94, 255, 94, 0.3);
			border-radius: 6px;
			text-align: right;
			font-size: 28px;
			font-weight: bold;
		}

		/* ======================================================
           PAINEL FLUTUANTE
           ====================================================== */

		.painel-flutuante {
			position: fixed;
			top: 220px;
			right: 30px;
			z-index: 2000;
			width: 140px;
			padding: 12px;
			background: rgba(15, 25, 35, 0.93);
			border: 2px solid #ff9800;
			border-radius: 8px;
			box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
		}

		.painel-header {
			padding-bottom: 6px;
			margin-bottom: 10px;
			color: #ff9800;
			border-bottom: 1px dashed rgba(255, 152, 0, 0.4);
			cursor: move;
			text-align: center;
			font-size: 11px;
			font-weight: bold;
			text-transform: uppercase;
		}

		.painel-corpo {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.btn-menu-vertical {
			width: 100%;
			padding: 8px 0;
			color: white;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			text-align: center;
			font-size: 12px;
			font-weight: bold;
			text-transform: uppercase;
		}

		.btn-menu-vertical:hover {
			transform: scale(1.03);
			filter: brightness(1.15);
		}

		.btn-incluir {
			background: #27ae60;
		}

		.btn-fechar {
			background: #e67e22;
		}

		.btn-excluir {
			background: #c0392b;
		}

		.btn-voltar {
			background: #7f8c8d;
		}

		.btn-carrinho {
			background: #c0492b;
		}


		.btn-devolucao {
			background: #EE82EE;
		}



		/* ======================================================
           RESPONSIVIDADE
           ====================================================== */

		@media (max-width: 900px) {
			body {
				padding: 12px;
			}

			.grid-caixa {
				flex-direction: column;
			}

			.bloco-arvore,
			.bloco-carrinho {
				min-width: 100%;
			}

			.bloco-devolve-prodduto,
			.bloco-devolucao {
				min-width: 100%;
			}





			.barra-localizacao {
				grid-template-columns: 1fr;
			}

			.painel-flutuante {
				top: auto;
				right: 12px;
				bottom: 12px;
			}
		}
	</style>
</head>

<body>

	<div class="container-fluid">

		<div class="d-flex justify-content-between align-items-center mb-2 px-2">

			<h2 class="m-0">
				⚡ Sistema Magia -
				<small style="color: #bdc3c7;">
					Balcão de Vendas Inteligente
				</small>
			</h2>

			<div>
				<span class="text-uppercase font-monospace me-2" style="font-size: 11px; color: #bdc3c7;">
					Status do Carrinho:
				</span>

				<span id="labelStatusCarrinho" class="status-badge status-andamento">
					SEM PEDIDO
				</span>
			</div>

		</div>

		<div class="grid-caixa">

			<!-- Parte 1: catálogo e árvore -->
			<div id="container-localizar-produto" class="bloco-arvore"></div>

			<!-- Parte 2: itens do cupom -->
			<div id="container-itens-cupom" class="bloco-carrinho"></div>

		</div>

	</div>

	<!-- Parte 3: modal de fechamento e painel flutuante -->
	<div id="container-fechamento-pedido"></div>



	<script>
		async function carregarComponente(idContainer, urlArquivo) {
			try {
				const resposta = await fetch(urlArquivo);

				if (!resposta.ok) {
					throw new Error(
						`Erro ao carregar ${urlArquivo}: HTTP ${resposta.status}`
					);
				}

				const html = await resposta.text();

				const container = document.getElementById(idContainer);

				if (container) {
					container.innerHTML = html;
				}

			} catch (erro) {
				console.error(erro);

				const container = document.getElementById(idContainer);

				if (container) {
					container.innerHTML = `
                        <div class="box-custom">
                            <div class="mensagem-vazia">
                                Não foi possível carregar este componente.
                            </div>
                        </div>
                    `;
				}
			}
		}

		async function carregarArquivoJavaScript(src) {
			return new Promise((resolve, reject) => {
				const script = document.createElement("script");

				script.src = src;
				script.onload = resolve;

				script.onerror = () => {
					reject(
						new Error(`Erro ao carregar o arquivo ${src}`)
					);
				};

				document.body.appendChild(script);
			});
		}

		// Programa principal da Mesa de Negociação
		async function inicializarTela() {
			try {
				await Promise.all([
					carregarComponente(
						"container-localizar-produto",
						"/componentes/localizar-produto.html"
					),

					carregarComponente(
						"container-itens-cupom",
						"/componentes/itens-cupom.html"
					),

					carregarComponente(
						"container-fechamento-pedido",
						"/componentes/fechamento-pedido.html"
					)
				]);

				configurarPainelArrastavel();

				const arquivosLogica = [
					'/componentes-js/utils.js',          // 🌟 primeiro de todos (está certo)
					'/vendas/venda.js',                  // ⚡ Corrigido: Aponta para a nova pasta física /vendas
					'/vendas/modulo-localizar.js',       // ⚡ Corrigido
					'/vendas/modulo-cupom.js',           // ⚡ Corrigido
					'/componentes-js/devolucao.js',
					'/componentes-js/cancelarPedido.js',
					'/componentes-js/carrinho.js',
					'/componentes-js/imprimeCarrinho.js', // 🌟 depois do carrinho.js
					'/vendas/modulo-fechamento.js'        // ⚡ Corrigido
				];

				for (const src of arquivosLogica) {
					await carregarArquivoJavaScript(src);
				}

				if (typeof inicializarLogicaVenda === "function") {
					inicializarLogicaVenda();
				} else {
					console.error(
						"A função inicializarLogicaVenda() não foi encontrada."
					);
				}

			} catch (erro) {
				console.error(
					"Erro ao inicializar a Mesa de Negociação:",
					erro
				);
			}
		}

		function configurarPainelArrastavel() {
			const painel = document.getElementById("painelCaixa");
			const header = document.getElementById("painelCaixaHeader");

			if (!painel || !header) {
				return;
			}

			let posicaoXAnterior = 0;
			let posicaoYAnterior = 0;

			header.onmousedown = iniciarArrasto;

			function iniciarArrasto(evento) {
				evento.preventDefault();

				posicaoXAnterior = evento.clientX;
				posicaoYAnterior = evento.clientY;

				document.onmouseup = pararArrasto;
				document.onmousemove = arrastarPainel;
			}

			function arrastarPainel(evento) {
				evento.preventDefault();

				const deslocamentoX =
					posicaoXAnterior - evento.clientX;

				const deslocamentoY =
					posicaoYAnterior - evento.clientY;

				posicaoXAnterior = evento.clientX;
				posicaoYAnterior = evento.clientY;

				painel.style.top =
					`${painel.offsetTop - deslocamentoY}px`;

				painel.style.left =
					`${painel.offsetLeft - deslocamentoX}px`;

				painel.style.right = "auto";
			}

			function pararArrasto() {
				document.onmouseup = null;
				document.onmousemove = null;
			}
		}

		window.addEventListener(
			"DOMContentLoaded",
			inicializarTela
		);
	</script>

			<script src="/vendas/modulo-fechamento.js" defer></script>
			<script src="/vendas/modulo-localizar.js" defer></script
</body>

</html>
