<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title>Entrada de Produto (Nota Fiscal)</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background: #2e5339;
			color: white;
			padding: 20px;
		}

		.container {
			max-width: 800px;
			margin: 0 auto;
			background: #1e3525;
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
		}

		h2 {
			border-bottom: 2px solid #e67e22;
			padding-bottom: 10px;
			color: #4af37a;
			margin-top: 0;
		}

		.row {
			display: flex;
			gap: 15px;
			margin-bottom: 15px;
		}

		.col {
			flex: 1;
			display: flex;
			flex-direction: column;
		}

		label {
			font-weight: bold;
			margin-bottom: 5px;
			color: #e67e22;
			font-size: 14px;
		}

		input,
		select {
			padding: 8px;
			border-radius: 4px;
			border: none;
			font-size: 14px;
			color: #333;
			background: #fff;
		}

		.btn-salvar {
			background: #e67e22;
			color: white;
			padding: 12px;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			font-weight: bold;
			margin-top: 15px;
			width: 100%;
			font-size: 16px;
		}

		.btn-salvar:hover {
			background: #d35400;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 15px;
			background: #25422e;
		}

		th,
		td {
			padding: 10px;
			border: 1px solid #1e3525;
			text-align: left;
		}

		th {
			background: #e67e22;
			color: white;
		}

		.painel-itens-nota {
			max-height: 220px;
			overflow-y: auto;
			margin-top: 15px;
			border: 1px solid #e67e22;
			border-radius: 4px;
		}
	</style>
</head>

<body>
	<div class="container">
		<h2>📦 Registrar Entrada de Mercadoria (Manual)</h2>

		<div class="row">
			<div class="col">
				<label>Número da Nota Fiscal</label>
				<input type="text" id="numeroNota" placeholder="Ex: 019995">
			</div>
			<div class="col">
				<label>Série</label>
				<input type="text" id="serie" placeholder="Ex: 001">
			</div>
			<div class="col">
				<label>Chave de Acesso (44 dígitos)</label>
				<input type="text" id="chaveAcesso" maxlength="44" placeholder="Digite os 44 números do DANFE">
			</div>
		</div>

		<div class="row">
			<div class="col">
				<label>Fornecedor</label>
				<select id="fornecedorId" onchange="carregarProdutosPorFornecedor()">
					<option value="">Carregando fornecedores...</option>
				</select>
			</div>
			<div class="col">
				<label>Data de Recebimento</label>
				<input type="date" id="dataRecebimento">
			</div>
		</div>

		<h2>🛒 Itens da Nota</h2>

		<div class="row" style="background: #25422e; padding: 10px; border-radius: 4px;">
			<div class="col" style="flex: 2;">
				<label>Produto</label>
				<select id="selectProduto">
					<option value="">Selecione o Fornecedor primeiro...</option>
				</select>
			</div>
			<div class="col">
				<label>Qtd. Entrada</label>
				<input type="number" id="qtdEntrada" value="1" min="1">
			</div>
			<div class="col">
				<label>Preço Custo (R$)</label>
				<input type="number" id="precoCusto" step="0.01" placeholder="0.00">
			</div>
			<div class="col" style="justify-content: flex-end;">
				<button type="button" onclick="adicionarItem()"
					style="background: #4af37a; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; color: #1e3525;">+
					Add</button>
			</div>
		</div>

		<div class="painel-itens-nota">
			<table id="tabelaItens">
				<thead>
					<tr>
						<th>Produto</th>
						<th>Qtd</th>
						<th>Preço Custo Unit.</th>
						<th>Total</th>
					</tr>
				</thead>
				<tbody>
				</tbody>
			</table>
		</div>
		<button type="button" class="btn-salvar" onclick="salvarEntrada()">Gravar Nota Fiscal</button>
		<!-- Botão para abrir o quadro de impostos -->
		<button type="button" class="btn-salvar" id="btnImpostos" onclick="abrirModalImpostos()"
			style="background: #7f8c8d; cursor: pointer; margin-top: 10px;">
			Impostos + Frete
		</button>


		<!-- 🌟 QUADRO DE IMPOSTOS FLUTUANTE E ARRASTÁVEL -->
		<div id="modalImpostos" class="modal-flutuante"
			style="display: none; position: fixed; top: 15%; left: 35%; width: 340px; max-height: 85vh; background: #1e3525; border-radius: 8px; overflow-y: auto; border: 2px solid #e67e22; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
			<div id="modalImpostosHeader"
				style="padding: 15px 20px 5px 20px; cursor: move; background: #16281c; border-bottom: 1px solid #25422e;">
				<h2 style="margin:0; font-size: 18px; color: #e67e22;">🧾 Impostos e Encargos (Arraste-me)</h2>
			</div>
			<div style="padding: 20px;">
				<div class="col" style="margin-bottom:10px;">
					<label>Base de Cálculo ICMS</label>
					<input type="number" step="0.01" id="baseCalculoIcms" placeholder="0.00">
				</div>
				<div class="col" style="margin-bottom:10px;">
					<label>Valor ICMS</label>
					<input type="number" step="0.01" id="valorIcms" placeholder="0.00">
				</div>
				<div class="col" style="margin-bottom:10px;">
					<label>Base de Cálculo ICMS Substituição</label>
					<input type="number" step="0.01" id="baseCalculoIcmsSt" placeholder="0.00">
				</div>
				<div class="col" style="margin-bottom:10px;">
					<label>Valor ICMS Substituição</label>
					<input type="number" step="0.01" id="valorIcmsSt" placeholder="0.00">
				</div>
				<div class="col" style="margin-bottom:10px;">
					<label>Valor Total dos Produtos</label>
					<input type="number" step="0.01" id="valorTotalProdutos" placeholder="0.00"
						oninput="calcularTotalNota()">
				</div>
				<div class="col" style="margin-bottom:10px;">
					<label>Valor do Frete</label>
					<input type="number" step="0.01" id="valorFrete" placeholder="0.00" oninput="calcularTotalNota()">
				</div>
				<div class="col" style="margin-bottom:10px;">
					<label>Valor do Seguro</label>
					<input type="number" step="0.01" id="valorSeguro" placeholder="0.00" oninput="calcularTotalNota()">
				</div>
				<div class="col" style="margin-bottom:10px;">
					<label>Desconto</label>
					<input type="number" step="0.01" id="valorDesconto" placeholder="0.00"
						oninput="calcularTotalNota()">
				</div>
				<div class="col" style="margin-bottom:10px;">
					<label>Outras Despesas Acessórias</label>
					<input type="number" step="0.01" id="outrasDespesasAcessorias" placeholder="0.00"
						oninput="calcularTotalNota()">
				</div>
				<div class="col" style="margin-bottom:10px;">
					<label>Valor do IPI</label>
					<input type="number" step="0.01" id="valorIpi" placeholder="0.00" oninput="calcularTotalNota()">
				</div>
				<div class="col" style="margin-bottom:15px;">
					<label>Valor Total da Nota</label>
					<input type="number" step="0.01" id="valorTotalNota" placeholder="0.00" readonly
						style="background: #eee; font-weight: bold; color: #333;">
				</div>

				<button type="button" class="btn-salvar" onclick="salvarImpostos()" style="width: 100%;">Confirmar
					Impostos</button>
				<button type="button" onclick="fecharModalImpostos()"
					style="width:100%; margin-top:8px; padding:10px; background:#7f8c8d; color:white; border:none; border-radius:4px; cursor:pointer;">Fechar</button>
			</div>
		</div>
	</div>


	</div>

	<script>

		let itensNota = [];

		document.getElementById('dataRecebimento').valueAsDate = new Date();

		function montarHeaders() {
			const meusHeaders = {'Content-Type': 'application/json'};
			const tokenArmazenado = localStorage.getItem('token');
			if (tokenArmazenado) {
				try {
					const objetoToken = JSON.parse(tokenArmazenado);
					const jwtPuro = objetoToken.token;
					if (jwtPuro) meusHeaders['Authorization'] = `Bearer ${jwtPuro}`;
				} catch (e) {
					const jwtLimpo = tokenArmazenado.replace(/^Bearer\s+/i, '');
					meusHeaders['Authorization'] = `Bearer ${jwtLimpo}`;
				}
			}
			return meusHeaders;
		}
		function adicionarItem() {
			const prodSelect = document.getElementById('selectProduto');
			const produtoId = prodSelect.value;
			const produtoTexto = prodSelect.options[prodSelect.selectedIndex].text;
			const qtd = parseFloat(document.getElementById('qtdEntrada').value);
			const custo = parseFloat(document.getElementById('precoCusto').value);

			if (!produtoId || isNaN(qtd) || isNaN(custo) || qtd <= 0 || custo <= 0) {
				alert("⚠️ Atenção: Preencha todos os campos do produto com valores válidos antes de adicionar!");
				return;
			}

			itensNota.push({
				produtoId: parseInt(produtoId),
				quantidade: parseInt(qtd),
				precoCusto: custo
			});

			const tabela = document.getElementById('tabelaItens').getElementsByTagName('tbody')[0];
			const novaLinha = tabela.insertRow();
			novaLinha.innerHTML = `
			            <td>
			                ${produtoTexto}
			                <label style="margin-left: 15px;">
			                    <input type="checkbox" class="check-excluir-item">
			                    Excluir
			                </label>
			            </td>
			            <td>${qtd}</td>
			            <td>R$ ${custo.toFixed(2)}</td>
			            <td>R$ ${(qtd * custo).toFixed(2)}</td>
			        `;

			prodSelect.value = '';
			document.getElementById('qtdEntrada').value = '1';
			document.getElementById('precoCusto').value = '';

			// 🧮 Atualiza o cálculo do painel de impostos automaticamente
			atualizarTotalProdutosDoModal();
		}



		// ----------------------------------------------------
		// 🎛️ CONTROLE DOS IMPOSTOS E TELA FLUTUANTE
		// ----------------------------------------------------
		function abrirModalImpostos() {
			document.getElementById("modalImpostos").style.display = "block";
			atualizarTotalProdutosDoModal();
		}

		function fecharModalImpostos() {
			document.getElementById("modalImpostos").style.display = "none";
		}

		function salvarImpostos() {
			calcularTotalNota();
			const total = document.getElementById("valorTotalNota").value;
			alert("✅ Valores aplicados na tela temporariamente! Total da Nota: R$ " + total);
			fecharModalImpostos();
		}

		function atualizarTotalProdutosDoModal() {
			let somaTotalProdutos = 0;
			itensNota.forEach(item => {
				somaTotalProdutos += (item.quantidade * item.precoCusto);
			});

			const campoProdutos = document.getElementById("valorTotalProdutos");
			if (campoProdutos) {
				campoProdutos.value = somaTotalProdutos.toFixed(2);
			}
			calcularTotalNota();
		}

		function calcularTotalNota() {
			const pegarFloat = (id) => parseFloat(document.getElementById(id).value) || 0;

			const produtos = pegarFloat("valorTotalProdutos");
			const frete = pegarFloat("valorFrete");
			const seguro = pegarFloat("valorSeguro");
			const ipi = pegarFloat("valorIpi");
			const outrasDespesas = pegarFloat("outrasDespesasAcessorias");
			const desconto = pegarFloat("valorDesconto");

			const valorCalculado = (produtos + frete + seguro + ipi + outrasDespesas) - desconto;

			const campoTotalNota = document.getElementById("valorTotalNota");
			if (campoTotalNota) {
				campoTotalNota.value = valorCalculado.toFixed(2);
			}
		}

		// Torna a janela de impostos arrastável
		dragElement(document.getElementById("modalImpostos"));

		function dragElement(elmnt) {
			if (!elmnt) return;
			var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
			if (document.getElementById(elmnt.id + "Header")) {
				document.getElementById(elmnt.id + "Header").onmousedown = dragMouseDown;
			} else {
				elmnt.onmousedown = dragMouseDown;
			}

			function dragMouseDown(e) {
				e = e || window.event;
				if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
				e.preventDefault();
				pos3 = e.clientX;
				pos4 = e.clientY;
				document.onmouseup = closeDragElement;
				document.onmousemove = elementDrag;
			}

			function elementDrag(e) {
				e = e || window.event;
				e.preventDefault();
				pos1 = pos3 - e.clientX;
				pos2 = pos4 - e.clientY;
				pos3 = e.clientX;
				pos4 = e.clientY;
				elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
				elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
			}

			function closeDragElement() {
				document.onmouseup = null;
				document.onmousemove = null;
			}
		}
	</script>

	
	<script src="/Entradas/entradaProduto.js"></script>


</body>

</html>
